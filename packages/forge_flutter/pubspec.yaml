name: forge_flutter
description: >-
  Bibliothèque des applications Flutter générées par forge : client de l'API,
  listes, détails, formulaires, calendrier, statistiques, CSV et comptes,
  pilotés par la description des tables.
version: 0.1.0
publish_to: none

environment:
  sdk: ^3.10.0
  flutter: ">=3.38.0"

dependencies:
  decimal: ^3.2.6
  file_picker: ^13.1.0
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_markdown_plus: ^1.0.12
  flutter_secure_storage: ^11.2.0
  go_router: ^18.0.2
  http: ^1.6.0
  intl: ^0.20.2
  url_launcher: ^6.3.3

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
