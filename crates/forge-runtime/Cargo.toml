[package]
name = "forge-runtime"
description = "Logique commune des applications générées par forge : CRUD, migrations, serveur."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[features]
# Outils de test des applications générées (base de test, vérification CRUD).
testing = ["dep:http-body-util"]
# Cache partagé Redis (`FORGE_CACHE_URL=redis://…`), en plus du cache en mémoire.
redis = ["dep:redis"]

[dependencies]
argon2.workspace = true
async-graphql.workspace = true
async-trait.workspace = true
axum.workspace = true
base64.workspace = true
chrono.workspace = true
clap.workspace = true
csv.workspace = true
forge-formula.workspace = true
forge-schema.workspace = true
http-body-util = { workspace = true, optional = true }
jsonwebtoken.workspace = true
metrics.workspace = true
metrics-exporter-prometheus.workspace = true
moka.workspace = true
redis = { workspace = true, optional = true }
rust_decimal.workspace = true
sea-orm.workspace = true
sea-orm-migration.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_urlencoded.workspace = true
sha2.workspace = true
thiserror.workspace = true
tokio.workspace = true
tower.workspace = true
tower-http.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
utoipa.workspace = true
utoipa-swagger-ui.workspace = true

[lints]
workspace = true

[dev-dependencies]
tempfile.workspace = true

[[test]]
name = "auth"
required-features = ["testing"]

[[test]]
name = "functions"
required-features = ["testing"]

[[test]]
name = "redis"
required-features = ["redis"]
