[workspace]
resolver = "3"
members = ["crates/*", "examples/crm/backend"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/coolbreeze68/coolbreezeapp"
rust-version = "1.88"

[workspace.dependencies]
forge-codegen = { path = "crates/forge-codegen" }
forge-formula = { path = "crates/forge-formula" }
forge-runtime = { path = "crates/forge-runtime" }
forge-schema = { path = "crates/forge-schema" }

anyhow = "1"
argon2 = { version = "0.5", features = ["std"] }
async-graphql = { version = "7", default-features = false, features = ["dataloader", "dynamic-schema", "graphiql"] }
async-trait = "0.1"
axum = "0.8"
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
clap = { version = "4", features = ["derive", "env"] }
csv = "1"
http-body-util = "0.1"
jsonwebtoken = { version = "11", default-features = false, features = ["rust_crypto"] }
minijinja = "2"
rust_decimal = "1"
schemars = "1"
sea-orm = { version = "2", default-features = false, features = [
    "macros",
    "runtime-tokio-rustls",
    "sqlx-mysql",
    "sqlx-postgres",
    "sqlx-sqlite",
    "with-chrono",
    "with-json",
    "with-rust_decimal",
] }
sea-orm-migration = { version = "2", default-features = false, features = [
    "runtime-tokio-rustls",
    "sqlx-mysql",
    "sqlx-postgres",
    "sqlx-sqlite",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_path_to_error = "0.1"
serde_urlencoded = "0.7"
sha2 = "0.10"
tempfile = "3"
toml = "1"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "sync"] }
tower = { version = "0.5", features = ["util"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
utoipa = "6"
utoipa-swagger-ui = { version = "10", features = ["axum", "vendored"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
must_use_candidate = "allow"

# Le hachage des mots de passe est volontairement coûteux : optimisé même en
# mode debug, pour des tests et un développement rapides.
[profile.dev.package.argon2]
opt-level = 3

[profile.dev.package.blake2]
opt-level = 3
