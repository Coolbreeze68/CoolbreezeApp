[workspace]
resolver = "3"
members = ["crates/*", "examples/crm/backend"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/coolbreeze68/coolbreezeapp"
rust-version = "1.85"

[workspace.dependencies]
forge-codegen = { path = "crates/forge-codegen" }
forge-formula = { path = "crates/forge-formula" }
forge-runtime = { path = "crates/forge-runtime" }
forge-schema = { path = "crates/forge-schema" }

anyhow = "1"
axum = "0.8"
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
clap = { version = "4", features = ["derive", "env"] }
http-body-util = "0.1"
minijinja = "2"
rust_decimal = "1"
schemars = "1"
sea-orm = { version = "2", default-features = false, features = [
    "macros",
    "runtime-tokio-rustls",
    "sqlx-mysql",
    "sqlx-postgres",
    "sqlx-sqlite",
    "with-chrono",
    "with-json",
    "with-rust_decimal",
] }
sea-orm-migration = { version = "2", default-features = false, features = [
    "runtime-tokio-rustls",
    "sqlx-mysql",
    "sqlx-postgres",
    "sqlx-sqlite",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_path_to_error = "0.1"
serde_urlencoded = "0.7"
tempfile = "3"
toml = "1"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal"] }
tower = { version = "0.5", features = ["util"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
must_use_candidate = "allow"
