name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  rust:
    name: fmt · clippy · tests (SQLite)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      # Sans la feature `redis` : variantes de code compilées sans elle.
      - run: cargo clippy --workspace --all-targets -- -D warnings
      # Inclut l'exemple CRM (membre du workspace) : CRUD complet sur SQLite,
      # et vérification que examples/crm est à jour (génération idempotente).
      - run: cargo test --workspace --all-features

  databases:
    name: exemple CRM sur ${{ matrix.db }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - db: postgres
            url: postgres://forge:forge@localhost:5432/crm_test
          - db: mysql
            url: mysql://forge:forge@127.0.0.1:3306/crm_test
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: forge
          POSTGRES_PASSWORD: forge
          POSTGRES_DB: crm_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U forge" --health-interval 5s --health-timeout 5s --health-retries 10
      mysql:
        image: mysql:8.4
        env:
          MYSQL_USER: forge
          MYSQL_PASSWORD: forge
          MYSQL_DATABASE: crm_test
          MYSQL_ROOT_PASSWORD: root
        ports: ["3306:3306"]
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1" --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # En premier : le scénario exige une base vide ; les tests suivants la recréent.
      - name: Scénario d'évolution du schéma
        run: ./scripts/e2e-evolution.sh
        env:
          DATABASE_URL: ${{ matrix.url }}
      - name: Migrations, authentification et fonctions (runtime)
        run: cargo test -p forge-runtime --all-features --test migration --test auth --test functions
        env:
          TEST_DATABASE_URL: ${{ matrix.url }}
      - name: CRUD, règles et formules du CRM
        run: cargo test -p mini_crm
        env:
          TEST_DATABASE_URL: ${{ matrix.url }}

  redis:
    name: cache Redis
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      TEST_CACHE_URL: redis://localhost:6379
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Cache partagé entre instances
        run: cargo test -p forge-runtime --features redis --test redis -- --include-ignored
      - name: Tests du CRM avec le cache Redis
        run: cargo test -p mini_crm --features forge-runtime/redis

  forge-new:
    name: forge new (projet autonome)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo build -p forge-cli
      - name: Création, régénération sans changement, compilation et tests
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/target
        run: |
          ./target/debug/forge new "$RUNNER_TEMP/crm" --schema examples/crm/forge.json
          ./target/debug/forge generate --dir "$RUNNER_TEMP/crm" | tee generate.log
          grep -q "Aucun changement" generate.log
          cargo test --manifest-path "$RUNNER_TEMP/crm/backend/Cargo.toml"
      - name: Scénario d'évolution du schéma (SQLite)
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/target
        run: ./scripts/e2e-evolution.sh

  flutter:
    name: Flutter (forge_flutter, app du CRM, bout en bout)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: forge_flutter
        working-directory: packages/forge_flutter
        run: |
          flutter pub get
          dart format --set-exit-if-changed lib test
          flutter analyze
          flutter test
      - name: App du CRM (code généré formaté, analyse, tests, compilation web)
        working-directory: examples/crm/app
        run: |
          flutter pub get
          dart format --set-exit-if-changed lib test
          flutter analyze
          flutter test
          flutter build web
      - name: Client contre le backend réel
        env:
          FORGE_ADMIN_EMAIL: admin@crm.test
          FORGE_ADMIN_PASSWORD: motdepasse123
          FORGE_ADDR: 127.0.0.1:8080
          DATABASE_URL: sqlite://${{ runner.temp }}/e2e.db?mode=rwc
        run: |
          cargo build -p mini_crm
          ./target/debug/mini_crm &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8080/health && break; sleep 1; done
          cd examples/crm/app
          FORGE_E2E_URL=http://127.0.0.1:8080 flutter test test/api_test.dart
      - name: "forge new : l'app générée passe ses tests"
        run: |
          cargo build -p forge-cli
          ./target/debug/forge new "$RUNNER_TEMP/projet" --schema examples/crm/forge.json
          cd "$RUNNER_TEMP/projet/app"
          flutter pub get
          flutter analyze
          flutter test

  docker:
    name: image Docker et docker-compose du CRM
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Démarrage avec PostgreSQL (docker-compose)
        working-directory: examples/crm
        env:
          FORGE_JWT_SECRET: ci
          FORGE_ADMIN_EMAIL: admin@ci.test
          FORGE_ADMIN_PASSWORD: motdepasse-ci
          POSTGRES_PASSWORD: ci
        run: |
          docker compose up -d --build --wait
          curl -sf http://localhost:8080/ | grep -q flutter_bootstrap.js
          curl -sf -X POST http://localhost:8080/api/auth/login -H 'content-type: application/json' \
            -d '{"email":"admin@ci.test","password":"motdepasse-ci"}' | grep -q access_token
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/api/inconnu)" = 404
      - if: failure()
        working-directory: examples/crm
        run: docker compose logs
